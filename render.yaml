services:
  - type: web
    name: medibook-ai-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      # DATABASE_URL phải dùng scheme postgresql+psycopg:// (theo backend/.env.example),
      # dùng postgresql:// sẽ khiến SQLAlchemy tìm psycopg2 và crash.
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
